name = "dipper"
main = "src/worker.js"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# El Worker se ejecuta cerca de la base D1: cada pantalla hace varias consultas y así cada viaje es más corto.
[placement]
mode = "smart"

# Registro de peticiones (Workers Logs) para poder revisar después qué llegó del atajo.
[observability]
enabled = true

# Registro: "si" deja crear cuentas a cualquiera; "no", solo la primera (app personal).
[vars]
REGISTRO_ABIERTO = "no"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "dipper"
database_id = "52bb4076-2c47-4c86-b359-794f1592f3f4"
migrations_dir = "migrations"

# Entorno de pruebas: https://dipper-pruebas.dipper-app.workers.dev con su propia base de datos.
# Cada rama se publica aquí para probarla antes de hacer el merge a main (npm run deploy:pruebas).
[env.pruebas]
name = "dipper-pruebas"

[env.pruebas.observability]
enabled = true

[env.pruebas.vars]
REGISTRO_ABIERTO = "si"
# Solo aquí se ve "Enviar aviso de prueba" en Ajustes.
AVISO_PRUEBA = "si"

[env.pruebas.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[env.pruebas.d1_databases]]
binding = "DB"
database_name = "dipper-pruebas"
database_id = "a80a2f68-c799-460e-b63e-ba576ff01912"
migrations_dir = "migrations"
