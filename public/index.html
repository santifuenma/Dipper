<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F1EDF9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- "default" y no "black-translucent": en iOS 18 la transparente deja una franja sin pintar abajo -->
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Dipper">
  <link rel="manifest" href="/manifest.webmanifest">
  <!-- ?v= obliga a iOS a descargar el icono de nuevo cuando cambia (lo guarda en caché) -->
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <link rel="icon" type="image/svg+xml" href="/dipper-icon.svg">
  <link rel="icon" type="image/png" href="/icon-192.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <title>Dipper</title>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
